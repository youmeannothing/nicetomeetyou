<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nice to Meet You — 하루짜리 지인 게시판</title>
  <meta name="description" content="매일 자정 사라지는 하루짜리 지인 구인 게시판">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div class="sheet">
    <header>
      <div class="t">지인 구함</div>
      <div class="st">nice to meet you :: 오늘 하루만 존재하는 게시판</div>
      <div class="meta">
        <span id="date-str">—</span> &nbsp;·&nbsp; 초기화까지 <b id="countdown">--:--:--</b>
      </div>
    </header>

    <section class="grp" aria-label="글쓰기">
      <div class="gh">글쓰기</div>
      <button type="button" id="compose-toggle" class="compose-toggle">
        <span class="plus">＋</span>새 글을 남기려면 여기를 누르세요
      </button>

      <form id="compose-form" class="compose-form" hidden>
        <p class="form-heading" id="form-heading">새 글 쓰기</p>
        <div class="field-row">
          <label class="field">
            <span class="label">이름 / 별명</span>
            <input type="text" id="f-name" maxlength="20" placeholder="익명" autocomplete="off">
          </label>
          <label class="field">
            <span class="label">비밀번호 <em>수정·삭제용</em></span>
            <input type="password" id="f-password" maxlength="30" minlength="4" required placeholder="4자 이상" autocomplete="new-password">
          </label>
        </div>
        <label class="field">
          <span class="label">제목</span>
          <input type="text" id="f-title" maxlength="60" required placeholder="예) 주말에 같이 전시 볼 사람">
        </label>
        <div class="field">
          <span class="label">내용</span>
          <div class="toolbar" id="toolbar">
            <button type="button" data-mark="**"><b>B</b></button>
            <button type="button" data-mark="*"><i>I</i></button>
            <button type="button" data-mark="__"><u>U</u></button>
            <button type="button" data-mark="~~"><s>S</s></button>
            <button type="button" data-mark="==" class="tb-hl">형광</button>
          </div>
          <textarea id="f-body" rows="5" maxlength="1000" required placeholder="어떤 사람을 찾는지, 어떻게 연락하면 되는지 적어주세요."></textarea>
          <p class="hint">드래그로 선택한 뒤 버튼을 누르면 **굵게** 같은 표시가 붙고, 게시되면 꾸민 모양으로 보입니다</p>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="label">링크 첨부 <em>선택</em></span>
            <input type="text" id="f-link" maxlength="200" placeholder="예) https://... 또는 instagram.com/..." autocomplete="off">
          </label>
          <div class="field">
            <span class="label">이미지 첨부 <em>선택</em></span>
            <input type="file" id="f-image" accept="image/*" hidden>
            <button type="button" id="image-btn" class="image-btn">이미지 선택…</button>
            <span class="image-note" id="image-note" hidden>
              <span id="image-name"></span>
              <button type="button" id="image-remove">제거</button>
            </span>
          </div>
        </div>
        <label class="field">
          <span class="label">연락 방법 <em>선택</em></span>
          <input type="text" id="f-contact" maxlength="80" placeholder="예) 오픈채팅 링크, 이메일, 인스타 아이디" autocomplete="off">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-solid" id="submit-btn">게재</button>
          <button type="button" class="btn" id="cancel-btn">접기</button>
        </div>
      </form>
    </section>

    <section class="grp" aria-label="오늘의 게시글">
      <div class="gh">오늘의 글
        <span class="cnt"><b id="post-count">0</b>건</span>
      </div>
      <ol id="post-list" class="post-list"></ol>
      <p id="empty-state" class="empty" hidden>
        아직 글이 없습니다. 오늘의 첫 글을 남겨보세요.
      </p>
    </section>

    <div class="corner">
      매일 밤 12시(KST)에 모든 글이 사라집니다<br>
      <span id="mode-badge" hidden>로컬 모드 — 글이 이 브라우저에만 저장됩니다</span>
    </div>
  </div>

  <dialog id="view-dialog" class="view-dialog">
    <div class="v-head">
      <div>
        <h3 id="v-title" class="v-title"></h3>
        <div id="v-meta" class="v-meta"></div>
      </div>
      <button type="button" id="v-close" class="v-close" aria-label="닫기">✕</button>
    </div>
    <img id="v-image" class="v-image" alt="" hidden>
    <div id="v-body" class="v-body"></div>
    <a id="v-link" class="v-link" target="_blank" rel="noopener noreferrer" hidden></a>
    <div id="v-contact" class="post-contact" hidden></div>
    <div class="v-actions">
      <button type="button" id="v-edit" class="btn">수정</button>
      <button type="button" id="v-del" class="btn">삭제</button>
    </div>
  </dialog>

  <dialog id="pw-dialog" class="pw-dialog">
    <form method="dialog" id="pw-form">
      <p class="pw-heading" id="pw-heading">비밀번호 확인</p>
      <input type="password" id="pw-input" maxlength="30" placeholder="게시글 비밀번호" autocomplete="off">
      <p class="pw-error" id="pw-error" hidden>비밀번호가 일치하지 않습니다.</p>
      <div class="form-actions">
        <button value="confirm" class="btn btn-solid">확인</button>
        <button value="cancel" class="btn" formnovalidate>취소</button>
      </div>
    </form>
  </dialog>

  <script src="config.js?v=3"></script>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
